<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game Form</title>
    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- CSS File -->
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body
    class="text-white bg-[url(/img/bg.png)] bg-cover bg-center bg-no-repeat"
  >
    <div class="flex items-center md:p-5 p-2 min-h-screen max-w-5xl m-auto">
      <div
        id="wrapper"
        class="w-full grid md:grid-cols-3 grid-cols-1 rounded-2xl overflow-hidden bg-black/30 backdrop-blur-md animate-[scale-up_2s_linear]"
      >
        <div class="relative md:h-[564px] h-[420px]">
          <img
            src="./img/welcome.gif"
            alt="Welcome Image"
            id="signupImg"
            class="absolute h-full w-full object-cover"
          />

          <img
            src="./img/welcome-back.gif"
            alt="Welcome Back Image"
            id="signinImg"
            class="absolute h-full w-full object-cover md:-bottom-full md:left-0 left-full"
          />
        </div>

        <div class="relative col-span-2 md:h-[564px] h-[620px]">
          <div
            class="absolute w-full h-full flex flex-col justify-center md:p-7 p-4 transition"
            id="signupForm"
          >
            <h3 class="capitalize text-center mb-4 md:text-4xl text-3xl">
              create an account
            </h3>

            <p class="text-gray-200 text-center mb-7">
              Already have an account? <a href="#" id="signin">signin</a>
            </p>

            <form class="mb-4">
              <div class="grid md:grid-cols-2 grid-cols-1 gap-4 mb-2">
                <div>
                  <label for="firstName" class="label-style">first name</label
                  ><input
                    type="text"
                    name="firstName"
                    id="firstName"
                    class="input-style"
                    required
                  />
                </div>
                <div>
                  <label for="lastName" class="label-style">last name</label
                  ><input
                    type="text"
                    name="lastName"
                    id="lastName"
                    class="input-style"
                    required
                  />
                </div>
              </div>

              <div class="mb-2">
                <label for="email" class="label-style">email</label
                ><input
                  type="email"
                  name="email"
                  id="email"
                  class="input-style"
                  required
                />
              </div>

              <div class="mb-2">
                <label for="password" class="label-style">password</label
                ><input
                  type="password"
                  name="password"
                  id="password"
                  class="input-style"
                  required
                />
              </div>

              <div class="mb-2">
                <label for="confirmPassword" class="label-style"
                  >confirm password</label
                ><input
                  type="password"
                  name="confirmPassword"
                  id="confirmPassword"
                  class="input-style"
                  required
                />
              </div>

              <div class="flex items-start my-4">
                <label for="terms" class="relative h-5 cursor-pointer"
                  ><input
                    type="checkbox"
                    checked
                    id="terms"
                    class="peer h-5 w-5 transition appearance-none rounded border border-sg-pink checked:bg-sg-pink"
                  />

                  <span
                    class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
                    ><i class="fa-solid fa-check"></i
                  ></span>
                </label>

                <label for="terms" class="ms-2 text-sm cursor-pointer"
                  >I agree with the <a href="#">terms & conditions</a></label
                >
              </div>

              <button
                type="submit"
                class="bg-sg-pink hover:bg-transparent border-2 border-sg-pink capitalize rounded-md w-full p-2 text-lg cursor-pointer transition"
              >
                signup
              </button>
            </form>
          </div>

          <div
            class="absolute w-full h-full flex flex-col justify-center md:p-7 p-4 transition md:bottom-full md:left-0 -left-full"
            id="signinForm"
          >
            <h3 class="capitalize text-center mb-4 md:text-4xl text-3xl">
              signin to your account
            </h3>

            <p class="text-gray-200 text-center mb-7">
              Have no account? <a href="#" id="signup">signup</a>
            </p>

            <form class="mb-4">
              <div class="mb-2">
                <label for="email" class="label-style">email</label
                ><input
                  type="email"
                  name="email"
                  id="email"
                  class="input-style"
                  required
                />
              </div>

              <div class="mb-2">
                <label for="password" class="label-style">password</label
                ><input
                  type="password"
                  name="password"
                  id="password"
                  class="input-style"
                  required
                />
              </div>

              <div class="flex items-start my-4">
                <label for="remember" class="relative h-5 cursor-pointer">
                  <input
                    type="checkbox"
                    id="remember"
                    checked
                    class="peer h-5 w-5 transition appearance-none rounded border border-sg-pink checked:bg-sg-pink"
                  />

                  <span
                    class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
                    ><i class="fa-solid fa-check"></i
                  ></span>
                </label>

                <label for="remember" class="ms-2 text-sm cursor-pointer"
                  >Remember me</label
                >
              </div>

              <button
                type="submit"
                class="bg-sg-pink hover:bg-transparent border-2 border-sg-pink capitalize rounded-md w-full p-2 text-lg cursor-pointer transition"
              >
                signup
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- JS File -->
    <script src="main.js"></script>
  </body>
</html>
