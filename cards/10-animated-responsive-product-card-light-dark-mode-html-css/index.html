<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-image"><img src="shoe-img.png" alt="Shoe Image" /></div>

      <div class="card-body">
        <h2 class="title">Fall limited edition air jordan</h2>

        <div class="rating">
          <i class="fas fa-star"></i><i class="fas fa-star"></i
          ><i class="fas fa-star"></i><i class="fas fa-star"></i
          ><i class="fas fa-star-half-stroke"></i> 4.8
          <span class="reviews">(24 reviews)</span>
        </div>

        <hr />

        <div class="pricing">
          <span class="current-price">$194<sup>06</sup></span>
          <span class="discount"> -24%</span>
          <p class="original-price">Original Price: <span>$255.34</span></p>
        </div>

        <div class="size">
          <h3>Size:</h3>
          <span>9</span>
          <span>10</span>
          <span class="active">11</span>
          <span>12</span>
          <span>13</span>
        </div>

        <p class="description">
          Limited-run Air Jordans with premium materials, seasonal styling, and
          cushioned comfort, a must-have for collectors.
        </p>

        <div class="action-btns">
          <button class="btn cart-btn">
            Add to Cart <i class="fas fa-cart-plus"></i>
          </button>
          <button class="btn buy-btn">
            Buy Now <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
