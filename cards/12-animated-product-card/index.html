<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Product Card</title>
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="img-box">
        <img src="headphone.png" alt="Headphone" />
      </div>

      <div class="content">
        <h2 class="title">Wireless Headphone</h2>

        <p class="description">
          Experience the freedom of wireless sound with our state-of-the-art
          headphones. Enjoy crystal-clear audio, deep bass, and a comfortable
          fit for all-day listening
        </p>

        <p class="price">$125.39</p>

        <button type="button" class="btn">Order Now</button>
      </div>
    </div>
  </body>
</html>
