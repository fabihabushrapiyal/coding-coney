<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folded Heart</title>
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap"
      rel="stylesheet"
    />

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" id="container">
      <div class="heart">
        <div class="heart-text">
          <p id="heartText1">Will you be my</p>
          <p id="heartText2">Valentine? 💗</p>
        </div>

        <div class="half-box">
          <div class="half-heart"></div>
        </div>

        <div class="half-box right">
          <div class="half-heart"></div>
        </div>
      </div>
      <div class="btns">
        <button type="button" class="btn open" id="openBtn">Click Here</button>

        <button type="button" class="btn yes" id="yesBtn">Yes</button>

        <button type="button" class="btn no" id="noBtn">No</button>
      </div>
    </div>
